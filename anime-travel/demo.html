<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>腾讯地图官方示例</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }
    #container {
      width: 100%;
      height: 100%;
    }
    .controls {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 100;
      background: white;
      padding: 5px;
      border-radius: 4px;
      box-shadow: 0 0 5px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>
  <div class="controls">
    <button onclick="searchNearby()">搜索附近酒店</button>
    <button onclick="drawRoute()">绘制上海→迪士尼路线</button>
  </div>
  <div id="container"></div>

  <!-- 腾讯地图JS API，官方推荐直接写在body末尾 -->
  <script src="https://map.qq.com/api/js?v=2.exp&key=YUKBZ-JIPCU-5DSVO-G2QGP-O7ONO-IHBAR"></script>
  <script>
    var map;
    var polyline;

    // 地图初始化，直接在JS API加载后执行
    map = new qq.maps.Map(document.getElementById("container"), {
      center: new qq.maps.LatLng(31.230416, 121.473701),
      zoom: 12
    });

    // 添加一个标记点，验证地图正常工作
    var marker = new qq.maps.Marker({
      position: new qq.maps.LatLng(31.230416, 121.473701),
      map: map
    });

    // 地点搜索（JSONP方式）
    function searchNearby() {
      var callbackName = 'searchCallback_' + Date.now();
      window[callbackName] = function(data) {
        if (data.status === 0) {
          data.data.forEach(item => {
            new qq.maps.Marker({
              position: new qq.maps.LatLng(item.location.lat, item.location.lng),
              map: map,
              title: item.title
            });
          });
        }
        delete window[callbackName];
      };

      var script = document.createElement('script');
      script.src = `https://apis.map.qq.com/ws/place/v1/search?keyword=酒店&boundary=nearby(39.908491,116.374328,1000)&key=YUKBZ-JIPCU-5DSVO-G2QGP-O7ONO-IHBAR&callback=${callbackName}`;
      document.body.appendChild(script);
    }

    // 路线规划（JSONP方式）
    function drawRoute() {
      var callbackName = 'routeCallback_' + Date.now();
      window[callbackName] = function(data) {
        if (data.status === 0) {
          var polylineStr = data.result.routes[0].polyline;
          var path = [];
          for (var i = 0; i < polylineStr.length; i += 2) {
            path.push(new qq.maps.LatLng(polylineStr[i + 1], polylineStr[i]));
          }

          if (polyline) polyline.setMap(null);
          polyline = new qq.maps.Polyline({
            path: path,
            strokeColor: "#2E8B57",
            strokeWeight: 6,
            map: map
          });

          map.fitBounds(new qq.maps.LatLngBounds(path));
        }
        delete window[callbackName];
      };

      var script = document.createElement('script');
      script.src = `https://apis.map.qq.com/ws/direction/v1/driving/?from=121.475078,31.235929&to=121.68898,31.14434&key=YUKBZ-JIPCU-5DSVO-G2QGP-O7ONO-IHBAR&callback=${callbackName}`;
      document.body.appendChild(script);
    }
  </script>
</body>
</html>
