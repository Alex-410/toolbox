<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手势粒子交互</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, sans-serif; background: #000; color: #e0e0e0; min-height: 100vh; display: flex; }

        .sidebar {
            width: 260px; background: rgba(10,10,10,0.95); border-right: 1px solid #222;
            padding: 16px; overflow-y: auto; flex-shrink: 0;
            display: flex; flex-direction: column; gap: 12px;
            position: relative; z-index: 10;
        }
        .sidebar h2 { font-size: 16px; }
        .sidebar a { color: #667eea; text-decoration: none; font-size: 13px; }

        .main { flex: 1; position: relative; overflow: hidden; }
        canvas { display: block; width: 100%; height: 100%; }
        video { display: none; }

        .preset-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
        .preset-btn {
            padding: 8px; background: #1a1a1a; border: 2px solid #2a2a2a;
            border-radius: 8px; cursor: pointer; text-align: center;
            font-size: 11px; color: #aaa; transition: all 0.15s;
        }
        .preset-btn:hover { border-color: #444; }
        .preset-btn.active { border-color: #667eea; background: #1a1a3a; color: #fff; }
        .preset-btn .icon { font-size: 20px; display: block; margin-bottom: 2px; }

        .mode-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
        .mode-btn {
            padding: 6px; background: #1a1a1a; border: 2px solid #2a2a2a;
            border-radius: 8px; cursor: pointer; text-align: center;
            font-size: 11px; color: #aaa; transition: all 0.15s;
        }
        .mode-btn:hover { border-color: #444; }
        .mode-btn.active { border-color: #ff6b6b; background: #2a1a1a; color: #fff; }
        .mode-btn .icon { font-size: 16px; display: block; margin-bottom: 2px; }

        button {
            padding: 8px 16px; background: #1e1e1e; border: 1px solid #333;
            border-radius: 8px; color: #e0e0e0; font-size: 13px; cursor: pointer;
        }
        button:hover { background: #2a2a2a; }
        button.primary { background: #1a73e8; border-color: #1a73e8; }

        .controls { display: flex; gap: 8px; flex-wrap: wrap; }

        .setting-group { display: flex; flex-direction: column; gap: 4px; }
        .setting-group label { font-size: 12px; color: #888; }
        input[type="range"] { -webkit-appearance: none; width: 100%; height: 4px; border-radius: 2px; background: #333; border: none; cursor: pointer; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #667eea; }

        .status-bar {
            position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.6); padding: 6px 16px; border-radius: 20px;
            font-size: 12px; color: #aaa; z-index: 5; display: flex; gap: 16px;
        }

        .gesture-indicator {
            position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.7); padding: 10px 24px; border-radius: 12px;
            font-size: 20px; z-index: 5; transition: all 0.2s;
        }

        #handPreview {
            position: absolute; bottom: 16px; right: 16px;
            width: 200px; height: 150px; border: 2px solid #333;
            border-radius: 8px; overflow: hidden; z-index: 5; display: none;
        }
        #handPreview canvas { width: 100%; height: 100%; }

        .tip-box {
            background: #1a1a1a; border-radius: 8px; padding: 10px;
            font-size: 11px; color: #666; line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <a href="index.html">&larr; 返回工具集</a>
        <h2>手势粒子交互</h2>

        <div class="setting-group">
            <label>交互模式</label>
            <div class="mode-grid" id="modeGrid">
                <div class="mode-btn active" data-mode="emit"><span class="icon">✨</span>指尖发射</div>
                <div class="mode-btn" data-mode="attract"><span class="icon">🌀</span>引力场</div>
                <div class="mode-btn" data-mode="repel"><span class="icon">💥</span>斥力场</div>
                <div class="mode-btn" data-mode="vortex"><span class="icon">🌪️</span>漩涡</div>
                <div class="mode-btn" data-mode="draw"><span class="icon">✏️</span>自由绘制</div>
                <div class="mode-btn" data-mode="orb"><span class="icon">🔮</span>粒子球</div>
            </div>
        </div>

        <div class="setting-group">
            <label>粒子预设</label>
            <div class="preset-grid" id="presetGrid">
                <div class="preset-btn active" data-preset="fire"><span class="icon">🔥</span>火焰</div>
                <div class="preset-btn" data-preset="neon"><span class="icon">💜</span>霓虹</div>
                <div class="preset-btn" data-preset="rainbow"><span class="icon">🌈</span>彩虹</div>
                <div class="preset-btn" data-preset="matrix"><span class="icon">💚</span>矩阵</div>
                <div class="preset-btn" data-preset="stars"><span class="icon">⭐</span>星空</div>
                <div class="preset-btn" data-preset="ice"><span class="icon">❄️</span>冰晶</div>
            </div>
        </div>

        <div class="setting-group">
            <label>粒子数量上限: <span id="countVal">2000</span></label>
            <input type="range" id="particleCount" min="500" max="8000" value="2000" step="500">
        </div>

        <div class="setting-group">
            <label>粒子大小: <span id="sizeVal">3</span></label>
            <input type="range" id="particleSize" min="1" max="8" value="3">
        </div>

        <div class="setting-group">
            <label>力场强度: <span id="forceVal">5</span></label>
            <input type="range" id="forceStrength" min="1" max="15" value="5">
        </div>

        <div class="setting-group">
            <label>拖尾: <span id="trailVal">0.10</span></label>
            <input type="range" id="trailAlpha" min="1" max="50" value="10">
        </div>

        <div id="cameraSelectorContainer"></div>

        <div class="controls">
            <button id="btnStart" class="primary">开启摄像头</button>
            <button id="btnPhoto">拍照</button>
            <button id="btnClear">清屏</button>
        </div>

        <div id="fpsDisplay" style="font-size:11px; color:#555;">FPS: -- | 粒子: 0</div>

        <div class="tip-box">
            <b>手势说明:</b><br>
            ✨ 指尖发射 - 五指张开，粒子从指尖喷射<br>
            🌀 引力场 - 张开手掌吸引粒子<br>
            💥 斥力场 - 握拳推开粒子<br>
            🌪️ 漩涡 - 捏合手势制造漩涡<br>
            ✏️ 自由绘制 - 食指指向画出持久粒子轨迹<br>
            🔮 粒子球 - 张开散开/握拳压缩/捏合旋转/食指吸引
        </div>
    </div>

    <div class="main">
        <div class="status-bar">
            <span id="statusBar">等待开启摄像头</span>
            <span id="gestureText"></span>
        </div>
        <div class="gesture-indicator" id="gestureIndicator" style="opacity:0;">🖐️</div>
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas"></canvas>
        <div id="handPreview"><canvas id="handCanvas" width="200" height="150"></canvas></div>
    </div>

    <script type="module">
        import { HandLandmarker, FilesetResolver } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/vision_bundle.mjs';
        import { initCameraSelector, getSelectedStream } from './camera-selector.js';

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const statusBar = document.getElementById('statusBar');
        const gestureText = document.getElementById('gestureText');
        const gestureIndicator = document.getElementById('gestureIndicator');
        const handCanvas = document.getElementById('handCanvas');
        const handCtx = handCanvas.getContext('2d');

        let handLandmarker = null;
        let stream = null;
        let animId = null;
        let frameCount = 0;
        let lastFpsTime = performance.now();

        let interactionMode = 'emit';
        let preset = 'fire';
        let maxParticles = 2000;
        let baseSize = 3;
        let forceStrength = 5;
        let trailAlpha = 0.10;

        let particles = [];
        let drawParticles = [];
        let handData = null;
        let prevHandData = null;
        let orbParticles = [];
        let orbInitialized = false;

        const PRESETS = {
            fire: {
                colors: ['#ff4500', '#ff6600', '#ff8800', '#ffaa00', '#ffcc00', '#fff200'],
                bg: 'rgba(0,0,0,α)'
            },
            neon: {
                colors: ['#ff00ff', '#ff00aa', '#cc00ff', '#aa00ff', '#ff0066'],
                bg: 'rgba(0,0,0,α)'
            },
            rainbow: {
                colors: ['#ff0000', '#ff8800', '#ffff00', '#00ff00', '#0088ff', '#8800ff', '#ff00ff'],
                bg: 'rgba(0,0,0,α)'
            },
            matrix: {
                colors: ['#00ff00', '#00cc00', '#009900', '#00ff66'],
                bg: 'rgba(0,3,0,α)'
            },
            stars: {
                colors: ['#ffffff', '#aaddff', '#ffddaa', '#ddddff'],
                bg: 'rgba(0,0,5,α)'
            },
            ice: {
                colors: ['#aaddff', '#88ccff', '#66bbff', '#ffffff', '#ddeeff'],
                bg: 'rgba(0,3,5,α)'
            }
        };

        const glowCache = {};
        function getGlowTexture(color, size) {
            const key = color + '|' + size;
            if (glowCache[key]) return glowCache[key];
            const r = size * 3;
            const s = r * 2;
            const c = document.createElement('canvas');
            c.width = s; c.height = s;
            const cx = c.getContext('2d');
            const grad = cx.createRadialGradient(r, r, 0, r, r, r);
            grad.addColorStop(0, color);
            grad.addColorStop(0.4, color + 'aa');
            grad.addColorStop(1, 'transparent');
            cx.fillStyle = grad;
            cx.fillRect(0, 0, s, s);
            glowCache[key] = c;
            return c;
        }

        class Particle {
            constructor(x, y, vx, vy, color) {
                this.x = x;
                this.y = y;
                this.vx = vx || (Math.random() - 0.5) * 2;
                this.vy = vy || (Math.random() - 0.5) * 2;
                this.life = 1;
                this.decay = 0.008 + Math.random() * 0.012;
                this.size = baseSize * (0.5 + Math.random());
                this.color = color || this.randomColor();
            }

            randomColor() {
                const colors = PRESETS[preset].colors;
                return colors[Math.floor(Math.random() * colors.length)];
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vx *= 0.98;
                this.vy *= 0.98;
                this.vy += 0.02;
                this.life -= this.decay;
            }
        }

        class DrawParticle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.vx = 0;
                this.vy = 0;
                this.life = 1;
                this.decay = 0.0003;
                this.size = baseSize * (0.6 + Math.random() * 0.4);
                this.color = color || this.randomColor();
            }

            randomColor() {
                const colors = PRESETS[preset].colors;
                return colors[Math.floor(Math.random() * colors.length)];
            }

            update() {
                this.life -= this.decay;
            }
        }

        function initOrb(cx, cy) {
            orbParticles = [];
            const radius = 120;
            const count = 300;
            for (let i = 0; i < count; i++) {
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                const r = radius * (0.3 + Math.random() * 0.7);
                orbParticles.push({
                    baseX: Math.cos(theta) * Math.sin(phi) * r,
                    baseY: Math.sin(theta) * Math.sin(phi) * r,
                    baseZ: Math.cos(phi) * r,
                    x: cx + Math.cos(theta) * Math.sin(phi) * r,
                    y: cy + Math.sin(theta) * Math.sin(phi) * r,
                    z: Math.cos(phi) * r,
                    vx: 0, vy: 0,
                    size: 1.5 + Math.random() * 2,
                    color: PRESETS[preset].colors[Math.floor(Math.random() * PRESETS[preset].colors.length)]
                });
            }
            orbInitialized = true;
        }

        function detectGesture(lm) {
            const tips = [4, 8, 12, 16, 20];
            const pips = [3, 6, 10, 14, 18];

            let fingersUp = 0;
            if (lm[4].x < lm[3].x) fingersUp++;
            for (let i = 1; i < 5; i++) {
                if (lm[tips[i]].y < lm[pips[i]].y) fingersUp++;
            }

            const thumbTip = lm[4];
            const indexTip = lm[8];
            const pinchDist = Math.hypot(thumbTip.x - indexTip.x, thumbTip.y - indexTip.y);

            let gesture = 'none';
            let icon = '✋';

            if (pinchDist < 0.05) {
                gesture = 'pinch';
                icon = '🤏';
            } else if (fingersUp === 0) {
                gesture = 'fist';
                icon = '✊';
            } else if (fingersUp === 1 && lm[8].y < lm[6].y) {
                gesture = 'point';
                icon = '☝️';
            } else if (fingersUp >= 4) {
                gesture = 'open';
                icon = '🖐️';
            } else {
                gesture = 'partial';
                icon = '🖖';
            }

            return { gesture, icon, fingersUp, pinchDist };
        }

        function getFingertips(lm, w, h) {
            return [4, 8, 12, 16, 20].map(i => ({
                x: (1 - lm[i].x) * w,
                y: lm[i].y * h
            }));
        }

        function getHandCenter(lm, w, h) {
            let cx = 0, cy = 0;
            for (const p of lm) {
                cx += (1 - p.x) * w;
                cy += p.y * h;
            }
            return { x: cx / lm.length, y: cy / lm.length };
        }

        function getHandVelocity(lm, prevLm, w, h) {
            if (!prevLm) return { vx: 0, vy: 0 };
            const curr = getHandCenter(lm, w, h);
            const prev = getHandCenter(prevLm, w, h);
            return { vx: (curr.x - prev.x) * 0.3, vy: (curr.y - prev.y) * 0.3 };
        }

        function applyInteraction(gesture, lm, w, h) {
            const center = getHandCenter(lm, w, h);
            const tips = getFingertips(lm, w, h);
            const vel = getHandVelocity(lm, prevHandData?.landmarks, w, h);
            const force = forceStrength;

            switch (interactionMode) {
                case 'emit':
                    if (gesture === 'open' || gesture === 'partial') {
                        for (const tip of tips) {
                            for (let i = 0; i < 3; i++) {
                                const angle = Math.random() * Math.PI * 2;
                                const speed = 1 + Math.random() * force * 0.5;
                                particles.push(new Particle(
                                    tip.x + (Math.random() - 0.5) * 10,
                                    tip.y + (Math.random() - 0.5) * 10,
                                    Math.cos(angle) * speed + vel.vx,
                                    Math.sin(angle) * speed + vel.vy - 1
                                ));
                            }
                        }
                    }
                    break;

                case 'attract':
                    if (gesture === 'open') {
                        for (const p of particles) {
                            const dx = center.x - p.x;
                            const dy = center.y - p.y;
                            const dist = Math.hypot(dx, dy);
                            if (dist < 250 && dist > 5) {
                                const f = force / dist;
                                p.vx += dx * f * 0.1;
                                p.vy += dy * f * 0.1;
                            }
                        }
                    } else {
                        for (const tip of tips) {
                            for (let i = 0; i < 2; i++) {
                                particles.push(new Particle(
                                    tip.x + (Math.random() - 0.5) * 8,
                                    tip.y + (Math.random() - 0.5) * 8,
                                    (Math.random() - 0.5) * 3,
                                    (Math.random() - 0.5) * 3
                                ));
                            }
                        }
                    }
                    break;

                case 'repel':
                    if (gesture === 'fist') {
                        for (const p of particles) {
                            const dx = p.x - center.x;
                            const dy = p.y - center.y;
                            const dist = Math.hypot(dx, dy);
                            if (dist < 200 && dist > 5) {
                                const f = force / dist;
                                p.vx += dx * f * 0.3;
                                p.vy += dy * f * 0.3;
                            }
                        }
                    } else {
                        for (const tip of tips) {
                            for (let i = 0; i < 2; i++) {
                                particles.push(new Particle(
                                    tip.x + (Math.random() - 0.5) * 8,
                                    tip.y + (Math.random() - 0.5) * 8,
                                    (Math.random() - 0.5) * 2,
                                    (Math.random() - 0.5) * 2
                                ));
                            }
                        }
                    }
                    break;

                case 'vortex':
                    for (const p of particles) {
                        const dx = p.x - center.x;
                        const dy = p.y - center.y;
                        const dist = Math.hypot(dx, dy);
                        if (dist < 200 && dist > 5) {
                            const angle = Math.atan2(dy, dx);
                            const tangentAngle = angle + Math.PI / 2;
                            const pull = gesture === 'pinch' ? force * 0.15 : force * 0.05;
                            const spin = gesture === 'pinch' ? force * 0.2 : force * 0.1;
                            const falloff = 1 - dist / 200;
                            p.vx += Math.cos(tangentAngle) * spin * falloff + dx * pull * 0.01;
                            p.vy += Math.sin(tangentAngle) * spin * falloff + dy * pull * 0.01;
                        }
                    }
                    for (let i = 0; i < 2; i++) {
                        const angle = Math.random() * Math.PI * 2;
                        const r = 20 + Math.random() * 40;
                        particles.push(new Particle(
                            center.x + Math.cos(angle) * r,
                            center.y + Math.sin(angle) * r,
                            Math.cos(angle + Math.PI / 2) * 2,
                            Math.sin(angle + Math.PI / 2) * 2
                        ));
                    }
                    break;

                case 'draw':
                    if (gesture === 'point') {
                        const tip = tips[1];
                        for (let i = 0; i < 8; i++) {
                            drawParticles.push(new DrawParticle(
                                tip.x + (Math.random() - 0.5) * 3,
                                tip.y + (Math.random() - 0.5) * 3
                            ));
                        }
                    }
                    break;

                case 'orb':
                    if (!orbInitialized) {
                        initOrb(w / 2, h / 2);
                    }
                    if (gesture === 'open') {
                        for (const op of orbParticles) {
                            const dx = op.x - center.x;
                            const dy = op.y - center.y;
                            const dist = Math.hypot(dx, dy);
                            if (dist < 300 && dist > 5) {
                                const f = force / dist * 2;
                                op.vx += dx * f;
                                op.vy += dy * f;
                            }
                        }
                    } else if (gesture === 'fist') {
                        for (const op of orbParticles) {
                            const dx = center.x - op.x;
                            const dy = center.y - op.y;
                            const dist = Math.hypot(dx, dy);
                            if (dist > 5) {
                                const f = force / dist * 1.5;
                                op.vx += dx * f;
                                op.vy += dy * f;
                            }
                        }
                    } else if (gesture === 'pinch') {
                        for (const op of orbParticles) {
                            const dx = op.x - center.x;
                            const dy = op.y - center.y;
                            const angle = Math.atan2(dy, dx);
                            const tangentAngle = angle + Math.PI / 2;
                            op.vx += Math.cos(tangentAngle) * force * 0.8;
                            op.vy += Math.sin(tangentAngle) * force * 0.8;
                        }
                    } else if (gesture === 'point') {
                        const tip = tips[1];
                        for (const op of orbParticles) {
                            const dx = tip.x - op.x;
                            const dy = tip.y - op.y;
                            const dist = Math.hypot(dx, dy);
                            if (dist < 200 && dist > 5) {
                                const f = force / dist * 3;
                                op.vx += dx * f;
                                op.vy += dy * f;
                            }
                        }
                    }
                    break;
            }
        }

        function spawnAmbient() {
            if (particles.length < 50 && handData) {
                const w = canvas.width, h = canvas.height;
                for (let i = 0; i < 3; i++) {
                    particles.push(new Particle(
                        Math.random() * w,
                        Math.random() * h,
                        (Math.random() - 0.5) * 0.5,
                        (Math.random() - 0.5) * 0.5
                    ));
                }
            }
        }

        async function initHandLandmarker() {
            statusBar.textContent = '加载手势模型...';
            try {
                const vision = await FilesetResolver.forVisionTasks(
                    'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm'
                );
                handLandmarker = await HandLandmarker.createFromOptions(vision, {
                    baseOptions: {
                        modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/latest/hand_landmarker.task',
                        delegate: 'GPU'
                    },
                    runningMode: 'VIDEO',
                    numHands: 2,
                    minHandDetectionConfidence: 0.5,
                    minTrackingConfidence: 0.5
                });
                statusBar.textContent = '运行中';
                return true;
            } catch (e) {
                console.error(e);
                statusBar.textContent = '模型加载失败: ' + e.message;
                return false;
            }
        }

        async function startCamera() {
            try {
                document.getElementById('btnStart').textContent = '加载中...';
                document.getElementById('btnStart').disabled = true;

                stream = await getSelectedStream();
                video.srcObject = stream;

                await new Promise((resolve, reject) => {
                    video.onloadedmetadata = () => {
                        video.play().then(resolve).catch(reject);
                    };
                    video.onerror = reject;
                    setTimeout(() => reject(new Error('视频加载超时')), 10000);
                });

                canvas.width = window.innerWidth - 260;
                canvas.height = window.innerHeight;

                if (!handLandmarker) {
                    const ok = await initHandLandmarker();
                    if (!ok) {
                        document.getElementById('btnStart').textContent = '开启摄像头';
                        document.getElementById('btnStart').disabled = false;
                        return;
                    }
                }

                document.getElementById('handPreview').style.display = 'block';
                document.getElementById('btnStart').textContent = '关闭摄像头';
                document.getElementById('btnStart').disabled = false;
                statusBar.textContent = '运行中';
                frameCount = 0;
                lastFpsTime = performance.now();
                processFrame();
            } catch (e) {
                console.error('启动失败:', e);
                statusBar.textContent = '错误: ' + e.message;
                document.getElementById('btnStart').textContent = '开启摄像头';
                document.getElementById('btnStart').disabled = false;
            }
        }

        function stopCamera() {
            if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
            if (animId) { cancelAnimationFrame(animId); animId = null; }
            video.srcObject = null;
            handData = null;
            prevHandData = null;
            orbParticles = [];
            orbInitialized = false;
            document.getElementById('handPreview').style.display = 'none';
            document.getElementById('btnStart').textContent = '开启摄像头';
            document.getElementById('btnStart').disabled = false;
            gestureIndicator.style.opacity = '0';
            statusBar.textContent = '已停止';
        }

        function processFrame() {
            if (!stream || !handLandmarker) return;
            animId = requestAnimationFrame(processFrame);

            if (video.readyState < 2) return;

            const now = performance.now();
            const w = canvas.width;
            const h = canvas.height;

            prevHandData = handData;
            handData = null;

            try {
                const results = handLandmarker.detectForVideo(video, now);

                handCtx.save();
                handCtx.translate(200, 0);
                handCtx.scale(-1, 1);
                handCtx.drawImage(video, 0, 0, 200, 150);
                handCtx.restore();

                if (results && results.landmarks && results.landmarks.length > 0) {
                    handData = {
                        landmarks: results.landmarks[0],
                        handedness: results.handedness?.[0]?.[0]?.categoryName || 'Right'
                    };

                    const lm = handData.landmarks;
                    const gestureInfo = detectGesture(lm);

                    gestureIndicator.textContent = gestureInfo.icon;
                    gestureIndicator.style.opacity = '1';
                    gestureText.textContent = gestureInfo.gesture;

                    applyInteraction(gestureInfo.gesture, lm, w, h);

                    for (let i = 1; i < results.landmarks.length; i++) {
                        const lm2 = results.landmarks[i];
                        const gestureInfo2 = detectGesture(lm2);
                        applyInteraction(gestureInfo2.gesture, lm2, w, h);
                    }
                } else {
                    gestureIndicator.style.opacity = '0';
                    gestureText.textContent = '';
                }
            } catch (e) {
                console.warn('detectForVideo error:', e);
            }

            spawnAmbient();

            ctx.fillStyle = PRESETS[preset].bg.replace('α', trailAlpha);
            ctx.fillRect(0, 0, w, h);

            let alive = 0;
            ctx.globalCompositeOperation = 'lighter';

            for (let i = drawParticles.length - 1; i >= 0; i--) {
                const p = drawParticles[i];
                p.update();
                if (p.life <= 0) {
                    drawParticles[i] = drawParticles[drawParticles.length - 1];
                    drawParticles.pop();
                    continue;
                }
                alive++;
                const alpha = Math.min(p.life, 1);
                const r = p.size * Math.min(p.life * 3, 1);
                if (r <= 0) continue;
                ctx.globalAlpha = alpha;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
                ctx.fill();
            }

            if (interactionMode === 'orb' && orbInitialized) {
                for (const op of orbParticles) {
                    const dx = op.baseX - (op.x - w / 2);
                    const dy = op.baseY - (op.y - h / 2);
                    op.vx += dx * 0.02;
                    op.vy += dy * 0.02;
                    op.vx *= 0.92;
                    op.vy *= 0.92;
                    op.x += op.vx;
                    op.y += op.vy;
                    const alpha = 0.5 + (op.z + 120) / 240 * 0.5;
                    const sizeMul = 0.5 + (op.z + 120) / 240 * 0.5;
                    ctx.globalAlpha = alpha;
                    ctx.fillStyle = op.color;
                    ctx.beginPath();
                    ctx.arc(op.x, op.y, op.size * sizeMul, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update();
                if (p.life <= 0) {
                    particles[i] = particles[particles.length - 1];
                    particles.pop();
                    continue;
                }
                if (p.x < -50 || p.x > w + 50 || p.y < -50 || p.y > h + 50) {
                    particles[i] = particles[particles.length - 1];
                    particles.pop();
                    continue;
                }
                alive++;
                const alpha = p.life;
                const r = p.size * alpha;
                if (r <= 0) continue;

                const tex = getGlowTexture(p.color, Math.ceil(r));
                ctx.globalAlpha = alpha * 0.5;
                ctx.drawImage(tex, p.x - tex.width / 2, p.y - tex.height / 2);

                ctx.globalAlpha = alpha;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalCompositeOperation = 'source-over';
            ctx.globalAlpha = 1;

            while (particles.length < maxParticles * 0.1 && handData && interactionMode !== 'draw' && interactionMode !== 'orb') {
                const lm = handData.landmarks;
                const center = getHandCenter(lm, w, h);
                particles.push(new Particle(
                    center.x + (Math.random() - 0.5) * 100,
                    center.y + (Math.random() - 0.5) * 100,
                    (Math.random() - 0.5) * 2,
                    (Math.random() - 0.5) * 2
                ));
            }

            if (drawParticles.length > 5000) {
                drawParticles.splice(0, drawParticles.length - 5000);
            }

            frameCount++;
            if (now - lastFpsTime > 1000) {
                document.getElementById('fpsDisplay').textContent = `FPS: ${frameCount} | 粒子: ${alive + orbParticles.length}`;
                frameCount = 0;
                lastFpsTime = now;
            }
        }

        document.getElementById('btnStart').onclick = () => stream ? stopCamera() : startCamera();
        document.getElementById('btnPhoto').onclick = () => {
            const link = document.createElement('a');
            link.download = 'gesture_particle_' + Date.now() + '.png';
            link.href = canvas.toDataURL();
            link.click();
        };
        document.getElementById('btnClear').onclick = () => {
            particles = [];
            drawParticles = [];
            orbParticles = [];
            orbInitialized = false;
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        };

        document.getElementById('modeGrid').onclick = (e) => {
            const btn = e.target.closest('.mode-btn');
            if (!btn) return;
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            interactionMode = btn.dataset.mode;
            if (interactionMode !== 'orb') {
                orbParticles = [];
                orbInitialized = false;
            }
        };

        document.getElementById('presetGrid').onclick = (e) => {
            const btn = e.target.closest('.preset-btn');
            if (!btn) return;
            document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            preset = btn.dataset.preset;
            for (const key in glowCache) delete glowCache[key];
            particles.forEach(p => {
                const colors = PRESETS[preset].colors;
                p.color = colors[Math.floor(Math.random() * colors.length)];
            });
        };

        document.getElementById('particleCount').oninput = (e) => {
            maxParticles = parseInt(e.target.value);
            document.getElementById('countVal').textContent = maxParticles;
        };
        document.getElementById('particleSize').oninput = (e) => {
            baseSize = parseInt(e.target.value);
            document.getElementById('sizeVal').textContent = baseSize;
        };
        document.getElementById('forceStrength').oninput = (e) => {
            forceStrength = parseInt(e.target.value);
            document.getElementById('forceVal').textContent = forceStrength;
        };
        document.getElementById('trailAlpha').oninput = (e) => {
            trailAlpha = parseInt(e.target.value) / 100;
            document.getElementById('trailVal').textContent = trailAlpha.toFixed(2);
        };

        window.addEventListener('resize', () => {
            if (stream) {
                canvas.width = window.innerWidth - 260;
                canvas.height = window.innerHeight;
            }
        });

        canvas.width = window.innerWidth - 260;
        canvas.height = window.innerHeight;
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        initCameraSelector(document.getElementById('cameraSelectorContainer'), async (deviceId) => {
            if (stream) {
                stream.getTracks().forEach(t => t.stop());
                stream = await getSelectedStream();
                video.srcObject = stream;
            }
        });
    </script>
</body>
</html>
