<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实时 3D 扭曲相机</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, sans-serif; background: #000; color: #e0e0e0; overflow: hidden; height: 100vh; }

        #threeCanvas { display: block; width: 100%; height: 100%; }
        video { display: none; }

        .sidebar {
            position: fixed; top: 0; right: 0; width: 260px; height: 100%;
            background: rgba(10,10,10,0.9); border-left: 1px solid #222;
            padding: 16px; overflow-y: auto; z-index: 10;
            display: flex; flex-direction: column; gap: 12px;
            backdrop-filter: blur(8px);
        }
        .sidebar h2 { font-size: 16px; }
        .sidebar a { color: #667eea; text-decoration: none; font-size: 13px; }

        .geo-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
        .geo-btn {
            padding: 8px; background: #1a1a1a; border: 2px solid #2a2a2a;
            border-radius: 8px; cursor: pointer; text-align: center;
            font-size: 11px; color: #aaa; transition: all 0.15s;
        }
        .geo-btn:hover { border-color: #444; }
        .geo-btn.active { border-color: #667eea; background: #1a1a3a; color: #fff; }
        .geo-btn .icon { font-size: 20px; display: block; margin-bottom: 2px; }

        button {
            padding: 8px 16px; background: #1e1e1e; border: 1px solid #333;
            border-radius: 8px; color: #e0e0e0; font-size: 13px; cursor: pointer;
        }
        button:hover { background: #2a2a2a; }
        button.primary { background: #1a73e8; border-color: #1a73e8; }

        .controls { display: flex; gap: 8px; flex-wrap: wrap; }

        .setting-group { display: flex; flex-direction: column; gap: 4px; }
        .setting-group label { font-size: 12px; color: #888; }
        input[type="range"] { -webkit-appearance: none; width: 100%; height: 4px; border-radius: 2px; background: #333; border: none; cursor: pointer; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #667eea; }
    </style>
</head>
<body>
    <video id="video" autoplay playsinline></video>
    <canvas id="threeCanvas"></canvas>

    <div class="sidebar">
        <a href="index.html">&larr; 返回工具集</a>
        <h2>3D 扭曲相机</h2>

        <div class="setting-group">
            <label>几何体</label>
            <div class="geo-grid" id="geoGrid">
                <div class="geo-btn active" data-geo="sphere"><span class="icon">🔮</span>球体</div>
                <div class="geo-btn" data-geo="torus"><span class="icon">🍩</span>环面</div>
                <div class="geo-btn" data-geo="wave"><span class="icon">🌊</span>波浪</div>
                <div class="geo-btn" data-geo="cylinder"><span class="icon">🪣</span>圆柱</div>
                <div class="geo-btn" data-geo="cone"><span class="icon">🔺</span>圆锥</div>
                <div class="geo-btn" data-geo="knot"><span class="icon">🪢</span>扭结</div>
            </div>
        </div>

        <div class="setting-group">
            <label>变形强度: <span id="distortVal">0.3</span></label>
            <input type="range" id="distortAmount" min="0" max="100" value="30">
        </div>

        <div class="setting-group">
            <label>变形速度: <span id="speedVal">1.0</span></label>
            <input type="range" id="distortSpeed" min="0" max="300" value="100">
        </div>

        <div class="setting-group">
            <label>细分级别: <span id="subdivVal">32</span></label>
            <input type="range" id="subdivision" min="8" max="64" value="32" step="8">
        </div>

        <div class="setting-group">
            <label>自动旋转</label>
            <select id="autoRotate" style="background:#1e1e1e;border:1px solid #333;border-radius:6px;color:#e0e0e0;padding:6px;font-size:13px;">
                <option value="on">开启</option>
                <option value="off">关闭</option>
            </select>
        </div>

        <div id="cameraSelectorContainer"></div>

        <div class="controls">
            <button id="btnStart" class="primary">开启摄像头</button>
            <button id="btnPhoto">拍照</button>
            <button id="btnFullscreen">全屏</button>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'https://cdn.jsdelivr.net/npm/three@latest/build/three.module.js';
        import { initCameraSelector, getSelectedStream } from './camera-selector.js';

        const video = document.getElementById('video');
        const canvas = document.getElementById('threeCanvas');

        let stream = null;
        let scene, camera, renderer, mesh, videoTexture;
        let currentGeo = 'sphere';
        let distortAmount = 0.3;
        let distortSpeed = 1.0;
        let subdivision = 32;
        let animId = null;

        // Init Three.js
        function initThree() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.z = 3;

            renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            // Light
            const ambient = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambient);
            const dir = new THREE.DirectionalLight(0xffffff, 0.5);
            dir.position.set(2, 2, 3);
            scene.add(dir);

            createGeometry();
        }

        function createGeometry() {
            if (mesh) scene.remove(mesh);

            let geometry;
            switch (currentGeo) {
                case 'sphere':
                    geometry = new THREE.SphereGeometry(1, subdivision, subdivision);
                    break;
                case 'torus':
                    geometry = new THREE.TorusGeometry(0.8, 0.35, subdivision, subdivision);
                    break;
                case 'wave':
                    geometry = new THREE.PlaneGeometry(3, 3, subdivision, subdivision);
                    break;
                case 'cylinder':
                    geometry = new THREE.CylinderGeometry(0.8, 0.8, 1.5, subdivision, subdivision);
                    break;
                case 'cone':
                    geometry = new THREE.ConeGeometry(0.8, 1.5, subdivision, subdivision);
                    break;
                case 'knot':
                    geometry = new THREE.TorusKnotGeometry(0.6, 0.25, subdivision * 3, subdivision);
                    break;
                default:
                    geometry = new THREE.SphereGeometry(1, subdivision, subdivision);
            }

            // Store original positions
            const posAttr = geometry.getAttribute('position');
            const origPositions = new Float32Array(posAttr.array.length);
            origPositions.set(posAttr.array);
            geometry.userData.origPositions = origPositions;

            const material = new THREE.MeshStandardMaterial({
                map: videoTexture,
                side: THREE.DoubleSide,
                metalness: 0.1,
                roughness: 0.8
            });

            mesh = new THREE.Mesh(geometry, material);
            scene.add(mesh);
        }

        function distortGeometry(time) {
            if (!mesh) return;
            const geometry = mesh.geometry;
            const posAttr = geometry.getAttribute('position');
            const orig = geometry.userData.origPositions;

            for (let i = 0; i < posAttr.count; i++) {
                const ox = orig[i * 3];
                const oy = orig[i * 3 + 1];
                const oz = orig[i * 3 + 2];

                let dx = 0, dy = 0, dz = 0;
                const t = time * distortSpeed;

                switch (currentGeo) {
                    case 'sphere':
                    case 'cylinder':
                    case 'cone':
                        const noise = Math.sin(ox * 3 + t) * Math.cos(oy * 3 + t * 0.7) * Math.sin(oz * 3 + t * 1.3);
                        const r = Math.sqrt(ox * ox + oy * oy + oz * oz) || 1;
                        dx = (ox / r) * noise * distortAmount;
                        dy = (oy / r) * noise * distortAmount;
                        dz = (oz / r) * noise * distortAmount;
                        break;
                    case 'torus':
                    case 'knot':
                        const n2 = Math.sin(ox * 5 + t) * Math.cos(oy * 5 + t * 0.8);
                        dx = n2 * distortAmount * 0.5;
                        dy = Math.sin(oz * 4 + t * 1.2) * distortAmount * 0.5;
                        dz = n2 * distortAmount * 0.3;
                        break;
                    case 'wave':
                        const wave = Math.sin(ox * 2 + t) * Math.cos(oy * 2 + t * 0.6);
                        dz = wave * distortAmount;
                        break;
                }

                posAttr.setXYZ(i, ox + dx, oy + dy, oz + dz);
            }

            posAttr.needsUpdate = true;
            geometry.computeVertexNormals();
        }

        function animate() {
            animId = requestAnimationFrame(animate);
            const time = performance.now() * 0.001;

            if (videoTexture && stream) {
                videoTexture.needsUpdate = true;
            }

            distortGeometry(time);

            if (document.getElementById('autoRotate').value === 'on' && mesh) {
                mesh.rotation.y += 0.003;
                mesh.rotation.x += 0.001;
            }

            renderer.render(scene, camera);
        }

        // Mouse drag
        let isDragging = false, lastMouse = { x: 0, y: 0 };
        canvas.addEventListener('mousedown', e => { isDragging = true; lastMouse = { x: e.clientX, y: e.clientY }; });
        canvas.addEventListener('mousemove', e => {
            if (!isDragging || !mesh) return;
            mesh.rotation.y += (e.clientX - lastMouse.x) * 0.005;
            mesh.rotation.x += (e.clientY - lastMouse.y) * 0.005;
            lastMouse = { x: e.clientX, y: e.clientY };
        });
        canvas.addEventListener('mouseup', () => isDragging = false);

        // Zoom
        canvas.addEventListener('wheel', e => {
            camera.position.z = Math.max(1.5, Math.min(8, camera.position.z + e.deltaY * 0.005));
        });

        async function startCamera() {
            try {
                stream = await getSelectedStream();
                video.srcObject = stream;
                await video.play();

                videoTexture = new THREE.VideoTexture(video);
                videoTexture.minFilter = THREE.LinearFilter;
                videoTexture.magFilter = THREE.LinearFilter;

                if (!scene) initThree();
                else { createGeometry(); }

                document.getElementById('btnStart').textContent = '关闭摄像头';
                animate();
            } catch (e) {
                console.error(e);
            }
        }

        function stopCamera() {
            if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
            if (animId) { cancelAnimationFrame(animId); animId = null; }
            video.srcObject = null;
            document.getElementById('btnStart').textContent = '开启摄像头';
        }

        // Events
        document.getElementById('btnStart').onclick = () => stream ? stopCamera() : startCamera();

        document.getElementById('btnPhoto').onclick = () => {
            renderer.render(scene, camera);
            const link = document.createElement('a');
            link.download = 'distortion_' + Date.now() + '.png';
            link.href = canvas.toDataURL();
            link.click();
        };

        document.getElementById('btnFullscreen').onclick = () => {
            if (document.fullscreenElement) document.exitFullscreen();
            else document.body.requestFullscreen();
        };

        document.getElementById('geoGrid').onclick = (e) => {
            const btn = e.target.closest('.geo-btn');
            if (!btn) return;
            document.querySelectorAll('.geo-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentGeo = btn.dataset.geo;
            if (scene) createGeometry();
        };

        document.getElementById('distortAmount').oninput = (e) => {
            distortAmount = parseInt(e.target.value) / 100;
            document.getElementById('distortVal').textContent = distortAmount.toFixed(2);
        };
        document.getElementById('distortSpeed').oninput = (e) => {
            distortSpeed = parseInt(e.target.value) / 100;
            document.getElementById('speedVal').textContent = distortSpeed.toFixed(1);
        };
        document.getElementById('subdivision').oninput = (e) => {
            subdivision = parseInt(e.target.value);
            document.getElementById('subdivVal').textContent = subdivision;
            if (scene) createGeometry();
        };

        window.addEventListener('resize', () => {
            if (camera && renderer) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        });

        initCameraSelector(document.getElementById('cameraSelectorContainer'), async (deviceId) => {
            if (stream) {
                stream.getTracks().forEach(t => t.stop());
                stream = await getSelectedStream();
                video.srcObject = stream;
            }
        });

        initThree();
        animate();
    </script>
</body>
</html>
