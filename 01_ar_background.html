<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR 背景替换工具</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, sans-serif; background: #0a0a0a; color: #e0e0e0; min-height: 100vh; display: flex; }

        .sidebar {
            width: 300px; background: #111; border-right: 1px solid #222;
            padding: 20px; overflow-y: auto; flex-shrink: 0;
            display: flex; flex-direction: column; gap: 16px;
        }
        .sidebar h2 { font-size: 18px; color: #fff; }
        .sidebar a { color: #667eea; text-decoration: none; font-size: 13px; }

        .main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; position: relative; }

        .video-container {
            position: relative; border-radius: 12px; overflow: hidden;
            box-shadow: 0 4px 24px rgba(0,0,0,0.5);
        }
        video { display: none; }
        #output { display: block; border-radius: 12px; max-width: 100%; max-height: 75vh; }

        .controls { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; justify-content: center; }

        button {
            padding: 8px 16px; background: #1e1e1e; border: 1px solid #333;
            border-radius: 8px; color: #e0e0e0; font-size: 13px; cursor: pointer;
            transition: all 0.15s;
        }
        button:hover { background: #2a2a2a; border-color: #555; }
        button.primary { background: #1a73e8; border-color: #1a73e8; }
        button.active { background: #667eea; border-color: #667eea; }

        .setting-group { display: flex; flex-direction: column; gap: 4px; }
        .setting-group label { font-size: 12px; color: #888; }
        .setting-group select, .setting-group input[type="range"] {
            background: #1e1e1e; border: 1px solid #333; border-radius: 6px;
            color: #e0e0e0; padding: 6px; font-size: 13px;
        }
        input[type="range"] { -webkit-appearance: none; height: 4px; border-radius: 2px; background: #333; border: none; cursor: pointer; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #667eea; }

        .bg-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
        .bg-option {
            width: 100%; aspect-ratio: 16/9; border-radius: 6px; cursor: pointer;
            border: 2px solid transparent; transition: border-color 0.15s;
            display: flex; align-items: center; justify-content: center;
            font-size: 11px; color: #aaa; text-align: center; padding: 4px;
        }
        .bg-option:hover { border-color: #555; }
        .bg-option.active { border-color: #667eea; }

        .status-bar {
            position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.7); padding: 6px 16px; border-radius: 20px;
            font-size: 12px; color: #aaa;
        }

        .loading-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8); display: flex; align-items: center;
            justify-content: center; flex-direction: column; gap: 12px;
            z-index: 10;
        }
        .spinner { width: 32px; height: 32px; border: 3px solid #333; border-top-color: #667eea; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="sidebar">
        <a href="index.html">&larr; 返回工具集</a>
        <h2>AR 背景替换</h2>

        <div class="setting-group">
            <label>背景模式</label>
            <div class="bg-grid" id="bgGrid">
                <div class="bg-option active" data-bg="blur" style="background: linear-gradient(135deg, #1a1a2e, #16213e);">模糊</div>
                <div class="bg-option" data-bg="gradient1" style="background: linear-gradient(135deg, #667eea, #764ba2);">渐变1</div>
                <div class="bg-option" data-bg="gradient2" style="background: linear-gradient(135deg, #f093fb, #f5576c);">渐变2</div>
                <div class="bg-option" data-bg="gradient3" style="background: linear-gradient(135deg, #4facfe, #00f2fe);">渐变3</div>
                <div class="bg-option" data-bg="green" style="background: #00b140;">绿幕</div>
                <div class="bg-option" data-bg="black" style="background: #000;">纯黑</div>
                <div class="bg-option" data-bg="image" style="background: #222; border-style: dashed;">自定义图片</div>
                <div class="bg-option" data-bg="none" style="background: #1a1a1a;">原画</div>
            </div>
        </div>

        <div id="cameraSelectorContainer"></div>

        <input type="file" id="bgFileInput" accept="image/*" style="display:none;">

        <div class="setting-group">
            <label>边缘柔化: <span id="smoothVal">5</span>px</label>
            <input type="range" id="edgeSmooth" min="0" max="20" value="5">
        </div>

        <div class="setting-group">
            <label>分割阈值: <span id="threshVal">0.6</span></label>
            <input type="range" id="threshold" min="0" max="100" value="60">
        </div>

        <div class="setting-group">
            <label>背景模糊强度: <span id="blurVal">15</span></label>
            <input type="range" id="bgBlur" min="0" max="40" value="15">
        </div>

        <div class="controls">
            <button id="btnStart" class="primary">开启摄像头</button>
            <button id="btnPhoto">拍照</button>
            <button id="btnRecord">录像</button>
        </div>

        <div id="fpsDisplay" style="font-size:11px; color:#555;">FPS: --</div>
    </div>

    <div class="main">
        <div class="status-bar" id="statusBar">等待开启摄像头</div>
        <div class="loading-overlay" id="loadingOverlay" style="display:none;">
            <div class="spinner"></div>
            <div style="font-size:13px; color:#aaa;">加载人像分割模型...</div>
        </div>
        <div class="video-container">
            <video id="video" autoplay playsinline></video>
            <canvas id="output"></canvas>
        </div>
    </div>

    <script type="module">
        import { ImageSegmenter, FilesetResolver } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/vision_bundle.mjs';
        import { initCameraSelector, getSelectedStream } from './camera-selector.js';

        const video = document.getElementById('video');
        const output = document.getElementById('output');
        const ctx = output.getContext('2d');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const statusBar = document.getElementById('statusBar');
        const fpsDisplay = document.getElementById('fpsDisplay');

        let segmenter = null;
        let stream = null;
        let bgMode = 'blur';
        let edgeSmooth = 5;
        let threshold = 0.6;
        let bgBlur = 15;
        let customBgImg = null;
        let animId = null;
        let mediaRecorder = null;
        let recordedChunks = [];
        let isRecording = false;

        // FPS tracking
        let frameCount = 0;
        let lastFpsTime = performance.now();

        // Background canvases
        const bgCanvas = document.createElement('canvas');
        const bgCtx = bgCanvas.getContext('2d');
        const maskCanvas = document.createElement('canvas');
        const maskCtx = maskCanvas.getContext('2d');

        // Init segmenter
        async function initSegmenter() {
            loadingOverlay.style.display = 'flex';
            try {
                const vision = await FilesetResolver.forVisionTasks(
                    'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm'
                );
                segmenter = await ImageSegmenter.createFromOptions(vision, {
                    baseOptions: {
                        modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite',
                        delegate: 'GPU'
                    },
                    runningMode: 'VIDEO',
                    outputCategoryMask: true
                });
                loadingOverlay.style.display = 'none';
                statusBar.textContent = '模型加载完成，开始处理';
                return true;
            } catch (e) {
                console.error(e);
                loadingOverlay.style.display = 'none';
                statusBar.textContent = '模型加载失败: ' + e.message;
                return false;
            }
        }

        // Start camera
        async function startCamera() {
            try {
                stream = await getSelectedStream();
                video.srcObject = stream;
                await video.play();

                output.width = video.videoWidth;
                output.height = video.videoHeight;
                bgCanvas.width = output.width;
                bgCanvas.height = output.height;
                maskCanvas.width = output.width;
                maskCanvas.height = output.height;

                if (!segmenter) {
                    const ok = await initSegmenter();
                    if (!ok) return;
                }

                document.getElementById('btnStart').textContent = '关闭摄像头';
                statusBar.textContent = '运行中';
                processFrame();

            } catch (e) {
                statusBar.textContent = '摄像头错误: ' + e.message;
            }
        }

        function stopCamera() {
            if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
            if (animId) { cancelAnimationFrame(animId); animId = null; }
            video.srcObject = null;
            document.getElementById('btnStart').textContent = '开启摄像头';
            statusBar.textContent = '已停止';
        }

        // Process frame
        function processFrame() {
            if (!stream || !segmenter) return;

            const now = performance.now();
            const result = segmenter.segmentForVideo(video, now);

            if (result && result.categoryMask) {
                const mask = result.categoryMask.getAsUint8Array();
                renderFrame(mask);
            }

            // FPS
            frameCount++;
            if (now - lastFpsTime > 1000) {
                fpsDisplay.textContent = 'FPS: ' + frameCount;
                frameCount = 0;
                lastFpsTime = now;
            }

            animId = requestAnimationFrame(processFrame);
        }

        function renderFrame(mask) {
            const w = output.width;
            const h = output.height;

            // Draw background
            drawBackground(w, h);

            // Create smooth mask
            const smoothMask = createSmoothMask(mask, w, h);

            // Composite: draw background first, then person on top using mask
            ctx.drawImage(bgCanvas, 0, 0);

            // Get current frame
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = w;
            tempCanvas.height = h;
            const tempCtx = tempCanvas.getContext('2d');
            tempCtx.drawImage(video, 0, 0, w, h);

            // Apply mask: only draw person pixels
            const imageData = tempCtx.getImageData(0, 0, w, h);
            const bgData = bgCtx.getImageData(0, 0, w, h);
            const outData = ctx.getImageData(0, 0, w, h);

            for (let i = 0; i < smoothMask.length; i++) {
                const a = smoothMask[i];
                if (a > 0.01) {
                    const idx = i * 4;
                    const inv = 1 - a;
                    outData.data[idx]     = imageData.data[idx]     * a + bgData.data[idx]     * inv;
                    outData.data[idx + 1] = imageData.data[idx + 1] * a + bgData.data[idx + 1] * inv;
                    outData.data[idx + 2] = imageData.data[idx + 2] * a + bgData.data[idx + 2] * inv;
                    outData.data[idx + 3] = 255;
                }
            }

            ctx.putImageData(outData, 0, 0);
        }

        function createSmoothMask(mask, w, h) {
            const smooth = new Float32Array(w * h);
            for (let i = 0; i < mask.length; i++) {
                // MediaPipe: 0 = person, 1 = background (invert)
                let val = mask[i] === 0 ? 1.0 : 0.0;

                // Apply threshold
                if (val > 0) {
                    val = val > threshold ? 1.0 : val / threshold;
                }
                smooth[i] = val;
            }

            // Edge feathering
            if (edgeSmooth > 0) {
                const kernel = Math.ceil(edgeSmooth);
                const temp = new Float32Array(smooth);
                // Box blur on edge region
                for (let y = kernel; y < h - kernel; y++) {
                    for (let x = kernel; x < w - kernel; x++) {
                        const idx = y * w + x;
                        if (smooth[idx] > 0.01 && smooth[idx] < 0.99) {
                            let sum = 0, count = 0;
                            for (let dy = -kernel; dy <= kernel; dy++) {
                                for (let dx = -kernel; dx <= kernel; dx++) {
                                    sum += smooth[(y + dy) * w + (x + dx)];
                                    count++;
                                }
                            }
                            temp[idx] = sum / count;
                        }
                    }
                }
                return temp;
            }
            return smooth;
        }

        function drawBackground(w, h) {
            bgCtx.clearRect(0, 0, w, h);

            switch (bgMode) {
                case 'blur':
                    // Blur the original video
                    bgCtx.filter = `blur(${bgBlur}px)`;
                    bgCtx.drawImage(video, 0, 0, w, h);
                    bgCtx.filter = 'none';
                    break;
                case 'gradient1':
                    const g1 = bgCtx.createLinearGradient(0, 0, w, h);
                    g1.addColorStop(0, '#667eea'); g1.addColorStop(1, '#764ba2');
                    bgCtx.fillStyle = g1; bgCtx.fillRect(0, 0, w, h);
                    break;
                case 'gradient2':
                    const g2 = bgCtx.createLinearGradient(0, 0, w, h);
                    g2.addColorStop(0, '#f093fb'); g2.addColorStop(1, '#f5576c');
                    bgCtx.fillStyle = g2; bgCtx.fillRect(0, 0, w, h);
                    break;
                case 'gradient3':
                    const g3 = bgCtx.createLinearGradient(0, 0, w, h);
                    g3.addColorStop(0, '#4facfe'); g3.addColorStop(1, '#00f2fe');
                    bgCtx.fillStyle = g3; bgCtx.fillRect(0, 0, w, h);
                    break;
                case 'green':
                    bgCtx.fillStyle = '#00b140'; bgCtx.fillRect(0, 0, w, h);
                    break;
                case 'black':
                    bgCtx.fillStyle = '#000'; bgCtx.fillRect(0, 0, w, h);
                    break;
                case 'image':
                    if (customBgImg) {
                        bgCtx.drawImage(customBgImg, 0, 0, w, h);
                    } else {
                        bgCtx.fillStyle = '#222'; bgCtx.fillRect(0, 0, w, h);
                    }
                    break;
                case 'none':
                    bgCtx.drawImage(video, 0, 0, w, h);
                    break;
            }
        }

        // Photo
        function takePhoto() {
            const link = document.createElement('a');
            link.download = 'ar_photo_' + Date.now() + '.png';
            link.href = output.toDataURL();
            link.click();
        }

        // Record
        function toggleRecord() {
            if (!isRecording) {
                recordedChunks = [];
                mediaRecorder = new MediaRecorder(output.captureStream(30), { mimeType: 'video/webm' });
                mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url; a.download = 'ar_video_' + Date.now() + '.webm'; a.click();
                    URL.revokeObjectURL(url);
                };
                mediaRecorder.start(100);
                isRecording = true;
                document.getElementById('btnRecord').textContent = '停止录像';
                document.getElementById('btnRecord').classList.add('active');
            } else {
                mediaRecorder.stop();
                isRecording = false;
                document.getElementById('btnRecord').textContent = '录像';
                document.getElementById('btnRecord').classList.remove('active');
            }
        }

        // Events
        document.getElementById('btnStart').onclick = () => stream ? stopCamera() : startCamera();
        document.getElementById('btnPhoto').onclick = takePhoto;
        document.getElementById('btnRecord').onclick = toggleRecord;

        document.getElementById('bgGrid').onclick = (e) => {
            const opt = e.target.closest('.bg-option');
            if (!opt) return;
            document.querySelectorAll('.bg-option').forEach(o => o.classList.remove('active'));
            opt.classList.add('active');
            bgMode = opt.dataset.bg;

            if (bgMode === 'image') {
                document.getElementById('bgFileInput').click();
            }
        };

        document.getElementById('bgFileInput').onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const img = new Image();
            img.onload = () => { customBgImg = img; };
            img.src = URL.createObjectURL(file);
        };

        document.getElementById('edgeSmooth').oninput = (e) => {
            edgeSmooth = parseInt(e.target.value);
            document.getElementById('smoothVal').textContent = edgeSmooth;
        };
        document.getElementById('threshold').oninput = (e) => {
            threshold = parseInt(e.target.value) / 100;
            document.getElementById('threshVal').textContent = threshold.toFixed(2);
        };
        document.getElementById('bgBlur').oninput = (e) => {
            bgBlur = parseInt(e.target.value);
            document.getElementById('blurVal').textContent = bgBlur;
        };

        // 初始化摄像头选择器
        initCameraSelector(document.getElementById('cameraSelectorContainer'), async (deviceId) => {
            if (stream) {
                stream.getTracks().forEach(t => t.stop());
                stream = await getSelectedStream();
                video.srcObject = stream;
            }
        });
    </script>
</body>
</html>
